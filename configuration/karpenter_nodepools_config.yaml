#
### This example showcases how to create actionable insights for Spot configurations of Karpenter NodePools
### The final goal is find configurations for your workload that can increase
### diversification and as a result increase the Spot Placement Score.
### This dashboard will be created with filters and 3 widgets for SPS and Price in all regions.
### The filters control Workload Type (Custom, Karpenter), Configuration Name, Target Capacity, and Unit Type
### WorkloadType = Karpenter are configurations defined in this file based on Karpenter NodePool structure
### WorkloadType = Custom are configurations defined in custom_config.yaml
###
### Unit Type only option is vcpu.
### Regions and Target Capacity are defined as global variables in custom_config.yaml and used for all configurations.
### The numbers have been kept deliberately low so this work in most accounts
### as an example. You are encouraged to modify this to your needs.
###
### The first Karpenter NodePool configuration `my-node-pool-r` is an
### example configuration that represents the current configuration used by the application
### Additional configurations that don't match specific NodePools can be added in the custom_config.yaml
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: my-node-pool-r
spec:
  template:
    metadata:
      labels:
        np: a
    spec:
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["r"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]          
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: inflate
      expireAfter: 720h # 30 * 24h = 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: my-node-pool-r-i
spec:
  template:
    metadata:
      labels:
        np: b
    spec:
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["r", "i"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]          
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: inflate
      expireAfter: 720h # 30 * 24h = 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m 